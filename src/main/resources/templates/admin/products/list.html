<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Products - Product Admin</title>
</head>
<body>
    <div th:replace="~{admin/layout :: body(content=~{::content})}">
        <div th:fragment="content">
            <div class="bg-white shadow overflow-hidden sm:rounded-lg mb-6">
                <div class="px-4 py-5 border-b border-gray-200 sm:px-6 flex justify-between items-center">
                    <div>
                        <h3 class="text-lg leading-6 font-medium text-gray-900">
                            Product List
                        </h3>
                        <p class="mt-1 max-w-2xl text-sm text-gray-500">
                            Manage your products.
                        </p>
                    </div>
                    <div>
                        <a th:href="@{/admin/products/create}" class="btn-primary inline-flex items-center">
                            <svg class="h-5 w-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"></path>
                            </svg>
                            Add New
                        </a>
                    </div>
                </div>
            </div>

            <div class="bg-white shadow overflow-hidden sm:rounded-lg">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    ID
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Name
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Price
                                </th>
                                <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Actions
                                </th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="product-table-body">
                            <tr th:if="${products.empty}">
                                <td colspan="4" class="px-6 py-4 whitespace-nowrap text-center text-gray-500">
                                    No products found
                                </td>
                            </tr>
                            <tr th:each="product : ${products}">
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${product.id}">
                                    ID
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${product.name}">
                                    Name
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${'$' + product.price}">
                                    Price
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                    <a href="#" class="text-blue-600 hover:text-blue-900 mr-3 edit-product" th:attr="data-id=${product.id}">Edit</a>
                                    <a href="#" class="text-red-600 hover:text-red-900 delete-product" th:attr="data-id=${product.id}">Delete</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    // Edit product
                    document.querySelectorAll('.edit-product').forEach(element => {
                        element.addEventListener('click', (e) => {
                            e.preventDefault();
                            const productId = e.target.getAttribute('data-id');
                            // Redirect to edit page or open modal
                            window.location.href = `/admin/products/${productId}/edit`;
                        });
                    });
                    
                    // Delete product
                    document.querySelectorAll('.delete-product').forEach(element => {
                        element.addEventListener('click', async (e) => {
                            e.preventDefault();
                            if (confirm('Are you sure you want to delete this product?')) {
                                const productId = e.target.getAttribute('data-id');
                                try {
                                    const response = await fetch(`/api/v1/products/${productId}`, {
                                        method: 'DELETE',
                                    });
                                    
                                    if (response.ok) {
                                        // Remove the row from the table
                                        e.target.closest('tr').remove();
                                        alert('Product deleted successfully!');
                                    } else {
                                        alert('Failed to delete product');
                                    }
                                } catch (error) {
                                    console.error('Error:', error);
                                    alert('An error occurred while deleting the product');
                                }
                            }
                        });
                    });
                });
            </script>
        </div>
    </div>
</body>
</html>
