<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Create Product - Product Admin</title>
</head>
<body>
    <div th:replace="~{admin/layout :: body(content=~{::content})}">
        <div th:fragment="content">
            <div class="bg-white shadow overflow-hidden sm:rounded-lg mb-6">
                <div class="px-4 py-5 border-b border-gray-200 sm:px-6">
                    <h3 class="text-lg leading-6 font-medium text-gray-900">
                        Create New Product
                    </h3>
                    <p class="mt-1 max-w-2xl text-sm text-gray-500">
                        Add a new product to the system.
                    </p>
                </div>
            </div>

            <div class="bg-white shadow overflow-hidden sm:rounded-lg">
                <div class="p-6">
                    <form id="create-product-form">
                        <div class="grid grid-cols-1 gap-6">
                            <div>
                                <label for="name" class="block text-sm font-medium text-gray-700">Product Name</label>
                                <input type="text" name="name" id="name" required
                                    class="mt-1 focus:ring-blue-500 focus:border-blue-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
                                <p class="mt-1 text-sm text-red-600 hidden" id="name-error"></p>
                            </div>
                            
                            <div>
                                <label for="price" class="block text-sm font-medium text-gray-700">Price</label>
                                <div class="mt-1 relative rounded-md shadow-sm">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <span class="text-gray-500 sm:text-sm">$</span>
                                    </div>
                                    <input type="number" name="price" id="price" required step="0.01" min="0.01"
                                        class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-7 pr-12 sm:text-sm border-gray-300 rounded-md">
                                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                                        <span class="text-gray-500 sm:text-sm">USD</span>
                                    </div>
                                </div>
                                <p class="mt-1 text-sm text-red-600 hidden" id="price-error"></p>
                            </div>
                            
                            <div class="flex justify-end">
                                <a th:href="@{/admin/products}" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 mr-2">
                                    Cancel
                                </a>
                                <button type="submit" class="btn-primary">
                                    Create Product
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    const form = document.getElementById('create-product-form');
                    const nameInput = document.getElementById('name');
                    const priceInput = document.getElementById('price');
                    const nameError = document.getElementById('name-error');
                    const priceError = document.getElementById('price-error');
                    
                    form.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        
                        // Reset error messages
                        nameError.classList.add('hidden');
                        priceError.classList.add('hidden');
                        
                        // Validate the form
                        let isValid = true;
                        
                        if (!nameInput.value.trim()) {
                            nameError.textContent = 'Product name is required';
                            nameError.classList.remove('hidden');
                            isValid = false;
                        }
                        
                        if (!priceInput.value || parseFloat(priceInput.value) <= 0) {
                            priceError.textContent = 'Price must be greater than zero';
                            priceError.classList.remove('hidden');
                            isValid = false;
                        }
                        
                        if (isValid) {
                            try {
                                const productData = {
                                    name: nameInput.value.trim(),
                                    price: parseFloat(priceInput.value)
                                };
                                
                                const response = await fetch('/api/v1/products', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify(productData)
                                });
                                
                                if (response.ok) {
                                    const result = await response.json();
                                    alert('Product created successfully!');
                                    window.location.href = '/admin/products';
                                } else {
                                    const error = await response.json();
                                    alert(`Failed to create product: ${error.message || 'Unknown error'}`);
                                }
                            } catch (error) {
                                console.error('Error:', error);
                                alert('An error occurred while creating the product');
                            }
                        }
                    });
                });
            </script>
        </div>
    </div>
</body>
</html>
